[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "f1-queue-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "playwright>=1.48,<2", "httpx>=0.27,<1"]
[tool.setuptools.package-data]
f1queue = ["static/*", "sim/*"]
[tool.setuptools.packages.find]
include = ["f1queue*"]
